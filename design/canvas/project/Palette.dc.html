<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TabFlow — командная палитра</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2DD4BF}a:hover{color:#5EEAD4}
</style>
</helmet>
<div style="width: 760px; height: 560px; box-sizing: border-box; background: rgba(5,6,8,0.64); font-family: 'Onest', system-ui, sans-serif; color: #E8EAED; font-size: 14px; line-height: 20px; display: flex; align-items: flex-start; justify-content: center; padding-top: 48px">
  <div role="dialog" aria-label="Командная палитра" style="width: 620px; background: #1D2228; border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 0 1px #262B33; overflow: hidden; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 56px; border-bottom: 1px solid #262B33">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA3AE" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="cmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Команда или поиск</label>
      <input id="cmd" type="text" value="react" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 16px; color: #E8EAED; background: transparent">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA3AE; border: 1px solid #262B33; border-radius: 6px; padding: 1px 6px">Esc</span>
    </div>

    <div style="padding: 8px; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #7F8893; padding: 8px 10px 4px">Группы</div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; background: #193032">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #8AB4F8"></span>
        <span>Исследование <mark style="background: transparent; color: #2DD4BF; font-weight: 600">React</mark></span>
        <span style="margin-left: auto; font-size: 12px; color: #9AA3AE">Активна · 12 вкладок</span>
      </div>

      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #7F8893; padding: 10px 10px 4px">Вкладки и видео</div>
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px">
          <span style="flex: none; width: 20px; height: 20px; border-radius: 5px; background: {{t.bg}}; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{t.letter}}</span>
          <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.pre}}<mark style="background: transparent; color: #2DD4BF; font-weight: 600">{{t.hit}}</mark>{{t.post}}</span>
          <span style="margin-left: auto; flex: none; font-size: 12px; color: #9AA3AE">{{t.where}}</span>
        </div>
      </sc-for>

      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #7F8893; padding: 10px 10px 4px">Действия</div>
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px">
          <span style="width: 20px; height: 20px; border-radius: 5px; background: #161A1F; border: 1px solid #262B33; color: #9AA3AE; display: flex; align-items: center; justify-content: center; font-size: 12px">›</span>
          <span>{{a.label}}</span>
          <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA3AE">{{a.kbd}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-top: 1px solid #262B33; background: #161A1F; font-size: 12px; color: #9AA3AE">
      <span><span style="font-family: 'JetBrains Mono', monospace">↑↓</span> выбрать</span>
      <span><span style="font-family: 'JetBrains Mono', monospace">Enter</span> открыть</span>
      <span><span style="font-family: 'JetBrains Mono', monospace">Shift Enter</span> рядом (split)</span>
      <span style="margin-left: auto"><span style="font-family: 'JetBrains Mono', monospace">Del</span> удалить</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      tabs: [
        { letter: 'Y', bg: '#B91C1C', pre: '', hit: 'React', post: ' Server Components — разбор на практике', where: 'Очередь · #1 · 18:42' },
        { letter: 'R', bg: '#2F5BD8', pre: 'useEffect – ', hit: 'React', post: '', where: 'Исследование React' },
        { letter: 'H', bg: '#0F766E', pre: '', hit: 'React', post: ' 19 — что нового', where: 'Статьи на вечер · убрана' }
      ],
      actions: [
        { label: 'Усыпить группу «Исследование React»', kbd: 'Ctrl ⇧ Z' },
        { label: 'Режим фокуса', kbd: 'Ctrl ⇧ F' },
        { label: 'Свернуть всё', kbd: 'Ctrl ⇧ S' }
      ]
    };
  }
}
</script>
</body>
</html>
