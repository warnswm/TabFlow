<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TabFlow — popup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2DD4BF}a:hover{color:#5EEAD4}
button,select{font-family:inherit}
</style>
</helmet>
<div style="width: 360px; height: 560px; box-sizing: border-box; background: #161A1F; color: #E8EAED; font-family: 'Onest', system-ui, sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; border: 1px solid #262B33; border-radius: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #262B33">
    <div style="width: 26px; height: 26px; border-radius: 7px; background: #2DD4BF; color: #04201C; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="1.5"></rect><rect x="14" y="4" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><path d="M14 17.5h7"></path></svg>
    </div>
    <div style="font-weight: 700; font-size: 15px">TabFlow</div>
    <button type="button" aria-label="Настройки" style="margin-left: auto; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #9AA3AE; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg>
    </button>
  </div>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #0E1013; border: 1px solid #262B33; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; line-height: 24px">38</span>
        <span style="font-size: 12px; line-height: 16px; color: #9AA3AE">вкладок</span>
      </div>
      <div style="background: #0E1013; border: 1px solid #262B33; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; line-height: 24px">3<span style="color: #7F8893">/7</span></span>
        <span style="font-size: 12px; line-height: 16px; color: #9AA3AE">групп спят</span>
      </div>
      <div style="background: #0E1013; border: 1px solid #262B33; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; line-height: 24px; color: #2DD4BF">1,8</span>
        <span style="font-size: 12px; line-height: 16px; color: #9AA3AE">ГБ свободно</span>
      </div>
    </div>
    <button type="button" style="height: 44px; border: 0; border-radius: 10px; background: #2DD4BF; color: #04201C; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6"></path><path d="M20 10h-6V4"></path><path d="m14 10 7-7"></path><path d="m3 21 7-7"></path></svg>
      Свернуть всё
    </button>
    <div style="display: flex; align-items: center; gap: 8px">
      <label for="dest" style="font-size: 13px; color: #9AA3AE">Куда</label>
      <select id="dest" style="flex: 1; height: 32px; border: 1px solid #656E7B; border-radius: 8px; background: #0E1013; color: #E8EAED; font-size: 13px; padding: 0 8px">
        <option>Новая группа (убрать в TabFlow)</option>
        <option>Работа › Chrome Extensions API</option>
        <option>Очередь видео</option>
      </select>
    </div>
  </div>

  <div style="padding: 0 8px; display: flex; flex-direction: column; gap: 2px">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #7F8893; padding: 4px 8px 6px">Быстрые действия</div>
    <button type="button" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #E8EAED; font-size: 14px; cursor: pointer; text-align: left">
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9AA3AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      Усыпить неактивные группы<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA3AE">4</span>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #E8EAED; font-size: 14px; cursor: pointer; text-align: left">
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9AA3AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="9"></circle></svg>
      Режим фокуса<span style="margin-left: auto; font-size: 12px; color: #9AA3AE">кроме «React»</span>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #E8EAED; font-size: 14px; cursor: pointer; text-align: left">
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9AA3AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m10 9 5 3-5 3z"></path></svg>
      Видео в очередь<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA3AE">18:42</span>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #E8EAED; font-size: 14px; cursor: pointer; text-align: left">
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9AA3AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="m8 12 3 3 5-6"></path></svg>
      Только выделенные<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA3AE">3</span>
    </button>
  </div>

  <div style="margin: 8px 16px 0; display: flex; align-items: center; gap: 10px">
    <input id="pinned" type="checkbox" checked style="width: 16px; height: 16px; accent-color: #2DD4BF">
    <label for="pinned" style="font-size: 13px; color: #9AA3AE">Не трогать закреплённые вкладки</label>
  </div>

  <div style="margin-top: auto; padding: 12px 16px; border-top: 1px solid #262B33; display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" style="font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px">Открыть TabFlow
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg>
    </a>
    <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA3AE; border: 1px solid #262B33; border-radius: 6px; padding: 1px 6px">Ctrl ⇧ S</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
