<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TabFlow — боковая панель, очередь</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2DD4BF}a:hover{color:#5EEAD4}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 380px; height: 820px; box-sizing: border-box; background: #0E1013; color: #E8EAED; font-family: 'Onest', system-ui, sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; border-left: 1px solid #262B33">
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px">
    <div style="width: 24px; height: 24px; border-radius: 7px; background: #2DD4BF; color: #04201C; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="1.5"></rect><rect x="14" y="4" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><path d="M14 17.5h7"></path></svg>
    </div>
    <div role="tablist" aria-label="Разделы панели" style="display: flex; background: #161A1F; border: 1px solid #262B33; border-radius: 8px; padding: 2px">
      <button type="button" role="tab" aria-selected="true" style="height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: #193032; color: #2DD4BF; font-size: 13px; font-weight: 600; cursor: pointer">Очередь</button>
      <button type="button" role="tab" aria-selected="false" style="height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #9AA3AE; font-size: 13px; cursor: pointer">Группы</button>
    </div>
    <button type="button" aria-label="Сортировка" style="margin-left: auto; width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: #9AA3AE; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"></path></svg>
    </button>
  </div>

  <div style="margin: 0 16px; background: #161A1F; border: 1px solid #262B33; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 13px; color: #9AA3AE">На сегодня</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">3 видео · 47 мин</span>
    </div>
    <div role="group" aria-label="Свободное время" style="display: flex; gap: 6px; flex-wrap: wrap">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{s.pressed}}" style="height: 26px; padding: 0 10px; border-radius: 9999px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer">{{s.label}}</button>
      </sc-for>
    </div>
    <div style="font-size: 12px; line-height: 16px; color: #7F8893">Есть 20 мин — успеете #1 и #3.</div>
  </div>

  <div style="padding: 14px 16px 6px; display: flex; align-items: baseline; gap: 8px">
    <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #7F8893">Очередь</h2>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #7F8893">12 · 3 ч 40 мин</span>
  </div>

  <ol style="list-style: none; margin: 0; padding: 0 8px; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
    <sc-for list="{{videos}}" as="v" hint-placeholder-count="6">
      <li style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; background: {{v.rowBg}}">
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="#7F8893"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
        <div style="position: relative; flex: none; width: 104px; height: 58px; border-radius: 8px; background: {{v.thumb}}; overflow: hidden; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="rgba(232,234,237,0.8)"><path d="M8 5.5v13l11-6.5z"></path></svg>
          <span style="position: absolute; right: 4px; bottom: 5px; font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 14px; background: rgba(5,6,8,0.8); border-radius: 4px; padding: 0 4px">{{v.duration}}</span>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(5,6,8,0.6)"><div style="width: {{v.progress}}; height: 3px; background: #2DD4BF"></div></div>
        </div>
        <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; line-height: 18px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{v.title}}</span>
          <span style="font-size: 12px; line-height: 16px; color: #9AA3AE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">#{{v.priority}} · {{v.source}}</span>
        </div>
      </li>
    </sc-for>
  </ol>

  <div style="margin-top: auto; padding: 12px 16px 16px; border-top: 1px solid #262B33; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="height: 40px; border: 0; border-radius: 10px; background: #2DD4BF; color: #04201C; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Добавить текущую вкладку
    </button>
    <div style="font-size: 12px; line-height: 16px; color: #7F8893; text-align: center">Перетаскивайте видео, чтобы менять приоритет</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":380,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    var slot = function (label, on) {
      return { label: label, pressed: on ? 'true' : 'false', bg: on ? '#193032' : 'transparent', fg: on ? '#2DD4BF' : '#9AA3AE', border: on ? '#193032' : '#262B33' };
    };
    var v = function (priority, title, source, duration, progress, thumb, current) {
      return { priority: priority, title: title, source: source, duration: duration, progress: progress, thumb: thumb, rowBg: current ? '#161A1F' : 'transparent' };
    };
    return {
      slots: [slot('10 мин', false), slot('20 мин', true), slot('40 мин', false), slot('1 ч+', false)],
      videos: [
        v(1, 'React Server Components — разбор на практике', 'YouTube', '18:42', '0%', '#1E3A4C', true),
        v(2, 'TypeScript generics: от простого к сложному', 'YouTube · 62 %', '24:10', '62%', '#24343A', false),
        v(3, 'Как устроены вкладки в Chromium', 'YouTube', '04:55', '0%', '#2E2A3F', false),
        v(4, 'Доклад: архитектура больших фронтендов', 'vkvideo.ru', '41:03', '0%', '#3A2E26', false),
        v(5, 'Dexie.js и IndexedDB за 15 минут', 'YouTube', '15:20', '0%', '#20323A', false),
        v(6, 'Tailwind v4: что изменилось', 'YouTube', '12:07', '0%', '#2A3324', false),
        v(7, 'Анимации в интерфейсах: меньше — лучше', 'YouTube', '09:48', '0%', '#33282E', false)
      ]
    };
  }
}
</script>
</body>
</html>
